name: Remove completed release branches (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-release-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete completed release branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          if [ "$default_branch" != 'main' ]; then
            echo "Unexpected default branch: $default_branch" >&2
            exit 1
          fi
          delete_verified_branch() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "Branch $branch has changed ($actual != $expected); refusing deletion." >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted branch $branch at $expected"
          }
          delete_verified_branch 'release/0.1.0' 'eae429ea7352374064e5ba8923320c05ef97c925'
          delete_verified_branch 'develop/0.3.0' 'c50195fb7036e78336e41b50f81ed8c5d54eab3d'
